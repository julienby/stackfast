# Conteneur(s) de l'app __SLUG__. Image, sécurité et limites viennent de la stack (stacks/php-htmx/app.compose.yml).
# Lancer avec `stackfast up __SLUG__`, jamais `docker compose` à la main (il lui manque le .env de l'instance).
name: ${STACKFAST_INSTANCE:-main}-__SLUG__

services:
  web:
    extends:
      file: ../../../stacks/php-htmx/app.compose.yml
      service: web
    # Nom joint par le proxy de l'instance : <instance>-<slug>.
    container_name: ${STACKFAST_INSTANCE:-main}-__SLUG__
    env_file: .env
    volumes:
      - ./:/app
      # - ./php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro   # réglage PHP propre à l'app (décision écrite)
    networks: [front]
    # mem_limit: 512m                                          # si l'app en a besoin (décision écrite)

  # Conteneur en plus, seulement si l'architecture l'impose (décision écrite dans l'AGENTS.md de l'app).
  # L'app le joint par son nom de service : http://worker:8000. Ajouter `back` aux networks de web.
  # worker:
  #   build: ./services/worker
  #   restart: unless-stopped
  #   env_file: .env
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: [no-new-privileges:true]
  #   mem_limit: 256m
  #   networks: [back]

networks:
  # Réseau de l'app, partagé seulement avec le proxy de l'instance. Aucune autre app ne le voit.
  front:
    name: ${STACKFAST_INSTANCE:-main}-__SLUG__
  # back:
  #   internal: true   # pas d'accès Internet, ni du proxy
