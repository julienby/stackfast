# Lancer depuis la racine de l'instance : bin/deploy php-htmx
# Variables : .env à la racine de l'instance (voir .env.example).
# Nom du projet = nom du conteneur : deux instances sur une machine ne se détruisent pas.
name: ${PHP_HTMX_CONTAINER:-php-htmx}
services:
  web:
    build: .
    container_name: ${PHP_HTMX_CONTAINER:-php-htmx}
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      - ../../apps/php-htmx:/var/www/html
      - ./lib:/var/www/stacks/php-htmx/lib:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-caddy-net}
