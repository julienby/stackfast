; Réglages PHP de la stack, communs à toutes les apps. Une app peut en surcharger dans son php.ini
; (ligne commentée dans son compose.yml). Les lignes « durcissement » viennent des avis de sécurité PHP :
; elles réduisent la surface, elles ne remplacent jamais `stackfast update`.

; Erreurs : dans les logs (stackfast logs <slug>), jamais à l'écran.
display_errors = Off
log_errors = On
expose_php = Off
zend.exception_ignore_args = On

; Limites. Le conteneur a son propre plafond mémoire (mem_limit) en plus de memory_limit.
memory_limit = 128M
upload_max_filesize = 10M
post_max_size = 20M
max_file_uploads = 10
max_input_vars = 1000
max_input_nesting_level = 32
max_execution_time = 30

; Durcissement (PHP2Shell, CVE-2026-109618/109619, oct. 2026) : chemins d'exploitation connus.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

; Durcissement général.
allow_url_include = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Le code est monté et modifié en place : opcache revérifie les fichiers chaque seconde.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1
