# Paramètres de la stack, lus par bin/ (update, proxy, audit). Format shell : VAR=valeur.

# Image de base. La branche PHP se choisit ici, et seulement ici (passer en 8.6 = changer cette ligne).
# Le correctif (8.5.x) n'est pas épinglé : `stackfast update` reconstruit avec --pull et récupère le dernier.
BASE_IMAGE=dunglas/frankenphp:1-php8.5-trixie

# Port interne du serveur de l'app (FrankenPHP, non root). Le proxy de l'instance s'y connecte.
PORT=8080
