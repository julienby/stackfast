<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>jbh</title>
<style>
  *, ::before, ::after { box-sizing: border-box; min-width: 0; }
  :root {
    color-scheme: light dark;
    --fond: light-dark(oklch(98% 0 none), oklch(20% 0 none));
    --texte: light-dark(oklch(22% 0 none), oklch(92% 0 none));
    --discret: light-dark(oklch(48% 0 none), oklch(70% 0 none));
    --trait: light-dark(oklch(88% 0 none), oklch(32% 0 none));
    --accent: light-dark(oklch(48% 0.16 255), oklch(75% 0.12 255));
    --erreur: light-dark(oklch(50% 0.18 25), oklch(75% 0.14 25));
    scrollbar-gutter: stable;
    text-wrap: pretty;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { text-wrap: balance; }
  body {
    margin: 0;
    min-block-size: 100svh;
    padding-inline: max(1rem, calc((100% - 48rem) / 2));
    padding-block: 1.5rem;
    background: var(--fond);
    color: var(--texte);
    font: 1rem/1.5 system-ui, sans-serif;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  header { display: flex; gap: 1rem; align-items: baseline; margin-block-end: 1.5rem; }
  header a:first-child { font-weight: 700; font-size: 1.25rem; text-decoration: none; }
  header button { margin-inline-start: auto; }
  h2 { margin-block: 0 1rem; font-size: 1.25rem; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { display: flex; gap: 1rem; justify-content: space-between; padding-block: 0.5rem; border-block-end: 1px solid var(--trait); }
  .discret { color: var(--discret); font-variant-numeric: tabular-nums; }
  .erreur { color: var(--erreur); }
  figure { margin: 1.5rem 0 0; }
  figcaption { font-weight: 600; margin-block-end: 0.5rem; }
  pre { margin: 0; padding: 1rem; overflow: auto; border: 1px solid var(--trait); border-radius: 0.5rem; font-size: 0.875rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  input, button { font: inherit; padding: 0.5rem 0.75rem; touch-action: manipulation; }
  input { flex: 1 1 16rem; color: inherit; background: transparent; border: 1px solid var(--trait); border-radius: 0.375rem; }
  button { color: inherit; background: transparent; border: 1px solid var(--trait); border-radius: 0.375rem; user-select: none; }
  button:active { scale: 0.97; }
  @media (hover: hover) and (pointer: fine) { button:hover { border-color: var(--accent); } }
</style>
<header>
  <a href="#/items">jbh</a>
  <a href="#/items?type=instructions-md">instructions-md</a>
  <a href="#/items?type=skill">skill</a>
  <button type="button" id="quitter" hidden>Quitter</button>
</header>
<main id="vue"></main>
<script>
const vue = document.getElementById('vue')
const quitter = document.getElementById('quitter')

const lire = () => { try { return sessionStorage.getItem('jbh-jeton') || '' } catch { return '' } }
const garder = (jeton) => { try { jeton ? sessionStorage.setItem('jbh-jeton', jeton) : sessionStorage.removeItem('jbh-jeton') } catch {} }

function el(nom, texte, attributs = {}) {
  const e = document.createElement(nom)
  if (texte !== undefined) e.textContent = texte
  for (const [cle, valeur] of Object.entries(attributs)) e.setAttribute(cle, valeur)
  return e
}

const lien = (texte, href) => el('a', texte, { href: '#' + href })
const afficher = (...noeuds) => vue.replaceChildren(...noeuds)
const erreur = (message) => afficher(el('p', message, { class: 'erreur', role: 'alert' }))

function demanderJeton(message) {
  const champ = el('input', undefined, { type: 'password', 'aria-label': 'Jeton', autocomplete: 'off', required: '' })
  const formulaire = el('form')
  formulaire.append(champ, el('button', 'Entrer'))
  formulaire.addEventListener('submit', (evenement) => {
    evenement.preventDefault()
    garder(champ.value.trim())
    montrer()
  })
  afficher(el('h2', 'Jeton'), ...(message ? [el('p', message, { class: 'erreur', role: 'alert' })] : []), formulaire)
  champ.focus()
}

async function appeler(chemin) {
  const reponse = await fetch(chemin, { headers: { Accept: 'application/json', Authorization: 'Bearer ' + lire() } })
  return { statut: reponse.status, donnees: await reponse.json().catch(() => ({})) }
}

function vueListe(donnees) {
  const ul = el('ul')
  for (const item of donnees.items) {
    const li = el('li')
    li.append(lien(item.type + '/' + item.name, item._links.self.href), el('span', 'v' + item.version, { class: 'discret' }))
    ul.append(li)
  }
  return [el('h2', 'Ressources'), donnees.items.length ? ul : el('p', 'Aucune ressource.', { class: 'discret' })]
}

function vueHistorique(donnees) {
  const ul = el('ul')
  for (const version of [...donnees.versions].reverse()) {
    const li = el('li')
    li.append(lien('v' + version.number, version._links.self.href), el('span', version.created_at, { class: 'discret' }))
    ul.append(li)
  }
  return [el('h2', 'Historique'), lien('← ressource', donnees._links.item.href), ul]
}

function vueDetail(donnees) {
  const liens = donnees._links
  const noeuds = [el('h2', donnees.type + '/' + donnees.name + ' v' + donnees.version), el('p', donnees.created_at, { class: 'discret' })]
  const navigation = el('p')
  navigation.append(lien('historique', liens.versions.href))
  if (liens.item) navigation.append(' · ', lien('dernière version', liens.item.href))
  noeuds.push(navigation)
  for (const fichier of donnees.files) {
    const figure = el('figure')
    figure.append(el('figcaption', fichier.path), el('pre', fichier.content))
    noeuds.push(figure)
  }
  return noeuds
}

async function montrer() {
  if (!lire()) { quitter.hidden = true; return demanderJeton() }
  quitter.hidden = false
  const chemin = location.hash.slice(1) || '/items'
  const { statut, donnees } = await appeler(chemin)
  if (statut === 401) { garder(''); quitter.hidden = true; return demanderJeton('Jeton refusé.') }
  if (statut !== 200) return erreur(donnees.error || 'Erreur ' + statut)
  if (donnees.items) return afficher(...vueListe(donnees))
  if (donnees.versions) return afficher(...vueHistorique(donnees))
  if (donnees.files) return afficher(...vueDetail(donnees))
  erreur('Réponse inconnue.')
}

quitter.addEventListener('click', () => { garder(''); montrer() })
addEventListener('hashchange', montrer)
montrer().catch(() => erreur('Le serveur ne répond pas.'))
</script>
</html>
